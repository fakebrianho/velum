<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Velum Demo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <nav class="nav">
        <a href="/" class="nav__link">Home</a>
        <a href="/about" class="nav__link">About</a>
        <a href="/contact" class="nav__link">Contact</a>
    </nav>

    <main data-router-view data-namespace="contact" class="page">

        <div class="hero-image1" data-flip-key="hero-image"></div>

        <div class="detail">
            <p data-animate class="detail__label">Contact · Creative Director · 2026</p>
            <h1 data-animate class="title">John Doe</h1>
            <p data-animate class="subtitle">
                John is an award winning creative director whose work consists of Dior, LVMH, Zara, Ikea.
            </p>
            <a data-animate href="/" class="cta">← Back to work</a>
        </div>

    </main>

    <script type="module" src="/main.js"></script>
</body>

</html>
