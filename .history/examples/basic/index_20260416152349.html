<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Velum Demo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <nav class="nav">
        <a href="/" class="nav__link">Home</a>
        <a href="/about" class="nav__link">About</a>
        <a href="/contact" class="nav__link">About</a>
    </nav>

    <main data-router-view data-namespace="home" class="page">

        <div data-animate class="intro">
            <h1 class="title">Velum</h1>
            <p class="subtitle">Seamless page transitions. Click the card below to see the hero morph.</p>
        </div>

        <a href="/about" class="card" data-animate>
            <div class="card__image" data-flip-key="hero-image"></div>
            <div class="card__body">
                <h2 class="card__title">Aurora Campaign</h2>
                <p class="card__meta">Branding · Visual Identity · 2024</p>
            </div>
        </a>

    </main>

    <script type="module" src="/main.js"></script>
</body>

</html>
