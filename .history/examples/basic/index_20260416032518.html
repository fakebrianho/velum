<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Velum Demo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <nav class="nav">
        <a href="/" class="nav__link">Home</a>
        <a href="/about" class="nav__link">About</a>
    </nav>

    <!-- This container gets swapped by your router -->
    <main data-router-view data-namespace="home" class="page">
        <section class="hero">
            <h1 data-animate class="title">Welcome Home</h1>
            <p data-animate class="subtitle">
                This is the seamless transition demo using your custom router.
            </p>

            <a href="/about" class="cta">Go to About →</a>
        </section>
    </main>

    <script type="module" src="/main.js"></script>
</body>

</html>
